# ==============================================================================
# SonarQube Project Configuration
# ==============================================================================

sonar.projectKey=grand_org-github-genai_automation-procurementdatabooster
sonar.projectName=GenAI Automation - Procurement Data Booster

# ==============================================================================
# Source Configuration
# ==============================================================================

# Python application source
sonar.sources=app_src/app/lambdas,app_terraform
sonar.tests=app_src/tests

# File inclusions
sonar.inclusions=\
  app_src/app/lambdas/**/*.py,\
  app_terraform/**/*.tf

# Exclusions (generated files, caches, dependencies, tests)
sonar.exclusions=\
  **/__pycache__/**,\
  **/.terraform/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/build/**,\
  app_terraform/.terraform.lock.hcl,\
  app_src/tests/**

# Test file inclusions
sonar.test.inclusions=app_src/tests/**/*.py

# Coverage exclusions (only measure coverage on application code)
sonar.coverage.exclusions=app_src/tests/**

# ==============================================================================
# Python Configuration
# ==============================================================================

sonar.python.version=3.12

# Coverage report (Cobertura format from pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# ==============================================================================
# Terraform / IaC Configuration
# ==============================================================================

# Terraform provider version is passed dynamically via scanner_extra_args in CI

# ==============================================================================
# Coverage - Disable JaCoCo (not applicable for Python projects)
# ==============================================================================

sonar.coverage.jacoco.xmlReportPaths=

# ==============================================================================
# Encoding
# ==============================================================================

sonar.sourceEncoding=UTF-8
