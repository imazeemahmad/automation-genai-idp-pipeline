name: 'Setup Python Environment'
description: 'Install Python, dependencies, and dev tools for quality checks'

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.12'

runs:
  using: 'composite'
  steps:
    - name: Set up root CA
      uses: grand_org-InnerSource/github-actions-library/setup-root-ca@main

    - name: Configure grand_org open-source mirrors (pip)
      uses: grand_org-InnerSource/github-actions-library/setup-oss-mirrors@main
      with:
        pypi: 'true'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          app_src/app/lambdas/requirements.txt
          .devcontainer/requirements.txt

    - name: Install dependencies
      shell: bash
      run: |
        pip install -r app_src/app/lambdas/requirements.txt
        pip install -r .devcontainer/requirements.txt
