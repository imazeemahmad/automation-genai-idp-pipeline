name: 'Setup AWS Environment'
description: 'Common setup for jobs requiring only AWS credentials (no Terraform)'

inputs:
  aws-role:
    description: 'AWS IAM role ARN to assume'
    required: true
  aws-region:
    description: 'AWS region'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up root CA
      uses: grand_org-InnerSource/github-actions-library/setup-root-ca@main

    - uses: grand_org-InnerSource/github-actions-library/install-aws-cli@main

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role }}
        role-session-name: deploy_idp
        aws-region: ${{ inputs.aws-region }}
